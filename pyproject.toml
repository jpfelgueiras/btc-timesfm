[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-timesfm"
version = "0.1.0"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".state"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
pretty = true
show_error_codes = true

[tool.coverage.run]
branch = true
source = [
    "btc_timesfm.forecasting.adaptive_weighting",
    "btc_timesfm.ops.drift_detection",
    "btc_timesfm.forecasting.experiment_manifest",
    "btc_timesfm.history.history_migrations",
    "btc_timesfm.history.history_store",
    "btc_timesfm.data.market_data_sources",
    "btc_timesfm.data.market_data_validation",
    "btc_timesfm.ops.observability",
    "btc_timesfm.ops.pipeline_health",
    "btc_timesfm.ops.promotion_policy",
    "btc_timesfm.ops.schedule_guard",
    "btc_timesfm.forecasting.statistical_significance",
    "btc_timesfm.x.format_tweet",
    "btc_timesfm.x.post_to_x",
    "btc_timesfm.x.twikit_compat",
    "btc_timesfm.x.x_post_registry",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
fail_under = 75
