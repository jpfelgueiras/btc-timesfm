[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-timesfm"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.4.6,<2.5; python_version < '3.12'",
    "numpy>=2.5.3,<2.6; python_version >= '3.12'",
    "requests>=2.34.2,<3",
    "twikit==2.3.3",
]

[project.optional-dependencies]
model = ["timesfm[torch]==3.0.2"]

[dependency-groups]
test = [
    "coverage[toml]>=7.16.1,<8",
    "mypy>=2.3.1,<3",
    "playwright==1.63.0",
    "ruff>=0.16.8,<1",
    "types-requests>=2.33.0.20260906,<3",
    "unittest-parallel>=1.8.6,<2",
]
security = ["pip-audit>=2.10.1,<3"]

[tool.uv]
required-version = ">=0.12,<0.13"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".state"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
pretty = true
show_error_codes = true

[tool.coverage.run]
branch = true
source = [
    "btc_timesfm.forecasting.adaptive_weighting",
    "btc_timesfm.forecasting.conditional_calibration",
    "btc_timesfm.ops.drift_detection",
    "btc_timesfm.forecasting.experiment_manifest",
    "btc_timesfm.history.history_migrations",
    "btc_timesfm.history.history_store",
    "btc_timesfm.data.market_data_sources",
    "btc_timesfm.data.market_data_validation",
    "btc_timesfm.ops.observability",
    "btc_timesfm.ops.pipeline_health",
    "btc_timesfm.ops.promotion_policy",
    "btc_timesfm.ops.rollback_safeguards",
    "btc_timesfm.ops.schedule_guard",
    "btc_timesfm.forecasting.statistical_significance",
    "btc_timesfm.research.segment_evaluation",
    "btc_timesfm.forecasting.multi_horizon_coherence",
    "btc_timesfm.x.format_tweet",
    "btc_timesfm.x.post_to_x",
    "btc_timesfm.x.twikit_compat",
    "btc_timesfm.x.x_post_registry",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
fail_under = 75
