site_name: BTC TimesFM
site_description: Documentation for the BTC/USD TimesFM forecasting project
site_url: https://jpfelgueiras.github.io/btc-timesfm/
repo_url: https://github.com/jpfelgueiras/btc-timesfm
docs_dir: docs
site_dir: build
use_directory_urls: true

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

plugins:
  - search
  - mermaid2:
      version: 11.4.1

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Forecasting:
      - Overview: forecasting.md
      - Forecast lifecycle: FORECAST_WORKS.md
      - Forecast confidence: FORECAST_CONFIDENCE.md
      - Public dashboard: PERFORMANCE_DASHBOARD.md
  - Data:
      - Overview: data.md
      - Market data: MARKET_DATA.md
      - Feature registry: FEATURE_REGISTRY.md
  - Evaluation:
      - Overview: evaluation.md
      - Statistical evidence: STATISTICAL_EVIDENCE.md
      - Cross-validation: CROSS_VALIDATION.md
  - API:
      - Overview: api.md
      - API contract: FORECAST_API_CONTRACT.md
      - API service: FORECAST_API_SERVICE.md
  - Operations:
      - Overview: operations.md
      - Workflows: CI_WORKFLOWS.md
      - History and schema: HISTORY_SCHEMA.md
      - Backups: HISTORY_BACKUP.md
  - Development:
      - Overview: development.md
      - Contributing: contributing.md
      - Documentation audit: DOCUMENTATION_AUDIT.md
  - Research archive: research/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jpfelgueiras/btc-timesfm
