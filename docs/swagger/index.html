<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BTC TimesFM API — Swagger UI</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
    <style>body { margin: 0; } .notice { margin: 1rem auto; max-width: 900px; padding: 0 1rem; font: 1rem/1.5 sans-serif; }</style>
  </head>
  <body>
    <p class="notice">This repository documents an optional authenticated API. No public API server is deployed, so “Try it out” is disabled.</p>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      SwaggerUIBundle({
        url: "../openapi.yaml",
        dom_id: "#swagger-ui",
        deepLinking: true,
        supportedSubmitMethods: [],
        presets: [SwaggerUIBundle.presets.apis],
        layout: "BaseLayout"
      });
    </script>
  </body>
</html>
