openapi: 3.1.0
info:
  title: BTC TimesFM Pages API
  version: 1.0.0
  description: >-
    Public, read-only forecast snapshots generated from durable history during
    each GitHub Pages build. This is a static API: responses change only when
    the site is rebuilt. No authentication or query-time filtering is provided.
servers:
  - url: https://jpfelgueiras.github.io/btc-timesfm
    description: Public GitHub Pages API
paths:
  /api/v1/forecasts/latest.json:
    get:
      summary: Get the latest published forecast
      operationId: getLatestForecastSnapshot
      responses:
        '200':
          description: Latest forecast and snapshot freshness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestSnapshot'
  /api/v1/forecasts.json:
    get:
      summary: Get the first page of published forecast history
      operationId: getFirstForecastSnapshotPage
      responses:
        '200':
          description: First immutable history page and its static continuation URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistorySnapshot'
  /api/v1/forecasts/page-{page}.json:
    get:
      summary: Get a continuation page of published forecast history
      operationId: getForecastSnapshotPage
      parameters:
        - in: path
          name: page
          required: true
          description: Four-digit page number from the preceding page's pagination.next_url.
          schema:
            type: string
            pattern: '^\d{4}$'
      responses:
        '200':
          description: Immutable history page and its static continuation URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistorySnapshot'
components:
  schemas:
    Freshness:
      type: object
      required: [observed_at, age_seconds, status]
      properties:
        observed_at:
          type: [string, 'null']
          format: date-time
        age_seconds:
          type: number
          minimum: 0
        status:
          type: string
          enum: [fresh, stale, unknown]
    Forecast:
      type: object
      required:
        - forecast_id
        - origin_at
        - target_at
        - horizon_hours
        - model
        - estimate
        - interval
        - confidence
        - run
        - lineage
        - freshness
      properties:
        forecast_id: { type: string }
        origin_at: { type: string, format: date-time }
        target_at: { type: string, format: date-time }
        horizon_hours: { type: integer, minimum: 1 }
        model: { type: object, additionalProperties: true }
        estimate: { type: object, additionalProperties: true }
        interval: { type: object, additionalProperties: true }
        confidence: { type: object, additionalProperties: true }
        run: { type: object, additionalProperties: true }
        lineage: { type: object, additionalProperties: true }
        freshness: { $ref: '#/components/schemas/Freshness' }
    LatestSnapshot:
      type: object
      required: [api_version, snapshot_at, data, freshness]
      properties:
        api_version: { type: string, const: v1 }
        snapshot_at: { type: string, format: date-time }
        data:
          oneOf:
            - $ref: '#/components/schemas/Forecast'
            - type: 'null'
        freshness: { $ref: '#/components/schemas/Freshness' }
    HistorySnapshot:
      type: object
      required: [api_version, snapshot_at, data, freshness, pagination]
      properties:
        api_version: { type: string, const: v1 }
        snapshot_at: { type: string, format: date-time }
        data:
          type: array
          items: { $ref: '#/components/schemas/Forecast' }
        freshness: { $ref: '#/components/schemas/Freshness' }
        pagination:
          type: object
          required: [page_size, next_url]
          properties:
            page_size: { type: integer, const: 100 }
            next_url: { type: [string, 'null'], format: uri }
