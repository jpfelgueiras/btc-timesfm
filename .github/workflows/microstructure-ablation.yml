name: BTC Microstructure Signal Ablation

on:
  workflow_dispatch:
    inputs:
      min_train:
        description: "Minimum matured training rows"
        required: false
        default: "24"
        type: string
  schedule:
    - cron: "17 6 * * 4"

permissions:
  contents: read

concurrency:
  group: btc-microstructure-ablation
  cancel-in-progress: false

env:
  HISTORY_RELEASE_TAG: forecast-history-v1

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Restore durable forecast history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .state
          gh release download "$HISTORY_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'forecast_history.sqlite.gz' \
            --dir .state
          gzip -df .state/forecast_history.sqlite.gz
          python history_store.py --db .state/forecast_history.sqlite verify

      - name: Run leakage-safe microstructure ablation
        run: |
          python microstructure_ablation.py \
            --db .state/forecast_history.sqlite \
            --min-train "${{ inputs.min_train || '24' }}"

      - name: Add summary
        if: always() && hashFiles('microstructure_ablation_summary.md') != ''
        run: cat microstructure_ablation_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: btc-microstructure-ablation-${{ github.run_id }}
          path: |
            microstructure_ablation_report.json
            microstructure_ablation_summary.md
          if-no-files-found: error
          retention-days: 90
