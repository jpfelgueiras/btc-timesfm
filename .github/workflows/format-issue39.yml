name: Format issue 39 Python files

on:
  push:
    branches:
      - feature/pipeline-health-circuit-breakers

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install 'ruff<1,>=0.16.5'
      - run: ruff format pipeline_health.py test_pipeline_health.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline_health.py test_pipeline_health.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Format pipeline health controls'
          git push
