name: Temporary roadmap issue 34 update

on:
  push:
    branches:
      - chore/roadmap-after-issue34
    paths:
      - roadmap_issue34_patch.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/roadmap-after-issue34
      - name: Update roadmap
        run: python roadmap_issue34_patch.py
      - name: Commit roadmap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm roadmap_issue34_patch.py
          git add ROADMAP.md
          git commit -m "Update roadmap after derivatives signals"
          git push origin HEAD:chore/roadmap-after-issue34
