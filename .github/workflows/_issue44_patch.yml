name: Apply issue 44 integration patch

on:
  push:
    branches: [feature/statistical-confidence-explanations]
    paths:
      - '.github/workflows/_issue44_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/statistical-confidence-explanations

      - name: Integrate confidence diagnostics and X formatter
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {text.count(old)}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'btc_forecast.py',
              'import forecast_engine\nfrom adaptive_weighting import adaptive_model_weights, attach_persisted_outcomes\n',
              'import forecast_engine\nfrom adaptive_weighting import adaptive_model_weights, attach_persisted_outcomes\nfrom forecast_confidence import build_forecast_confidence\n',
          )
          replace_once(
              'btc_forecast.py',
              '    interval_calibration_evaluation = evaluation_report(\n        history, actuals, regime=str(engine_output["regime"])\n    )\n    generated_at = datetime.now(timezone.utc)\n',
              '    interval_calibration_evaluation = evaluation_report(\n        history, actuals, regime=str(engine_output["regime"])\n    )\n    forecast_confidence = build_forecast_confidence(\n        engine_output["predictions"],\n        summary,\n        interval_calibration_evaluation,\n        drift_report,\n    )\n    generated_at = datetime.now(timezone.utc)\n',
          )
          replace_once(
              'btc_forecast.py',
              '        "interval_calibration_evaluation": interval_calibration_evaluation,\n        **engine_output,\n',
              '        "interval_calibration_evaluation": interval_calibration_evaluation,\n        "forecast_confidence": forecast_confidence,\n        **engine_output,\n',
          )

          confidence_function = '''\n\ndef confidence_text(output: dict[str, Any], *, compact: bool = False) -> str | None:\n    """Render an evidence band only when all four horizons have enough OOS support."""\n    confidence = output.get("forecast_confidence")\n    if not isinstance(confidence, dict) or confidence.get("status") != "available":\n        return None\n\n    label = str(confidence.get("label") or "").lower()\n    if label not in {"low", "moderate", "high"}:\n        return None\n    try:\n        samples = int(confidence["minimum_evidence_samples"])\n        edge = float(confidence["minimum_edge_vs_persistence_pct"])\n    except (KeyError, TypeError, ValueError):\n        return None\n    if samples < 1 or not math.isfinite(edge):\n        return None\n\n    short_label = {"low": "LOW", "moderate": "MOD", "high": "HIGH"}[label]\n    if compact:\n        return f"📊 Conf {short_label} • edge≥{edge:+.0f}% • n≥{samples}"\n    return f"📊 Confidence {short_label} • min edge {edge:+.1f}% vs persistence • n≥{samples}"\n'''
          replace_once(
              'format_tweet.py',
              '\n\ndef _render_tweet(\n',
              confidence_function + '\n\ndef _render_tweet(\n',
          )
          replace_once(
              'format_tweet.py',
              '    include_consensus: bool,\n    include_price: bool,\n',
              '    include_confidence: bool,\n    compact_confidence: bool,\n    include_price: bool,\n',
          )
          replace_once(
              'format_tweet.py',
              '    if include_consensus:\n        lines.append(consensus_text(predictions))\n\n',
              '    if include_confidence:\n        confidence = confidence_text(output, compact=compact_confidence)\n        if confidence:\n            lines.append(confidence)\n\n',
          )
          replace_once(
              'format_tweet.py',
              '    attempts = (\n        dict(compact=False, include_consensus=True, include_price=True),\n        dict(compact=False, include_consensus=False, include_price=True),\n        dict(compact=False, include_consensus=False, include_price=False),\n        dict(compact=True, include_consensus=False, include_price=False),\n    )\n',
              '    attempts = (\n        dict(compact=False, include_confidence=True, compact_confidence=False, include_price=True),\n        dict(compact=False, include_confidence=True, compact_confidence=True, include_price=True),\n        dict(compact=False, include_confidence=True, compact_confidence=True, include_price=False),\n        dict(compact=True, include_confidence=True, compact_confidence=True, include_price=False),\n        dict(compact=True, include_confidence=False, compact_confidence=True, include_price=False),\n    )\n',
          )

          sample_confidence = '''        "forecast_confidence": {\n            "status": "available",\n            "label": "moderate",\n            "score": 61.0,\n            "minimum_evidence_samples": 28,\n            "minimum_edge_vs_persistence_pct": 4.2,\n        },\n'''
          replace_once(
              'test_format_tweet.py',
              '        "forecast_reliability": {\n',
              sample_confidence + '        "forecast_reliability": {\n',
          )
          replace_once(
              'test_format_tweet.py',
              '        self.assertIn("🤝 4/4 bullish", tweet)\n        self.assertIn("💰 $79,733 • ⚠️ Experimental • NFA", tweet)\n',
              '        self.assertIn("📊", tweet)\n        self.assertIn("edge", tweet)\n        self.assertNotIn("🤝 4/4 bullish", tweet)\n        self.assertIn("💰 $79,733 • ⚠️ Experimental • NFA", tweet)\n',
          )
          replace_once(
              'test_format_tweet.py',
              '    def test_consensus_reports_dominant_direction(self) -> None:\n',
              '    def test_insufficient_evidence_suppresses_confidence_claim(self) -> None:\n        output = sample_output()\n        output["forecast_confidence"] = {"status": "insufficient_evidence"}\n        tweet = build_visual_tweet(output)\n        self.assertNotIn("Confidence", tweet)\n        self.assertNotIn("📊 Conf", tweet)\n\n    def test_consensus_reports_dominant_direction(self) -> None:\n',
          )
          PY

          git rm .github/workflows/_issue44_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc_forecast.py format_tweet.py test_format_tweet.py
          git commit -m "Integrate confidence diagnostics into forecasts and X posts"
          git push origin HEAD:feature/statistical-confidence-explanations
