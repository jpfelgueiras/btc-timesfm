name: Apply issue 31 integration

on:
  push:
    branches:
      - feature/conformal-calibration

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/conformal-calibration
      - name: Apply integration patch
        run: python3 _apply_issue31.py
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Integrate conformal interval calibration [issue31-applied]"
          git push origin HEAD:feature/conformal-calibration
