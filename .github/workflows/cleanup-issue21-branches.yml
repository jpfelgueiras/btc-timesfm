name: Clean merged issue 21 branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete merged branches
        run: |
          git push origin --delete feature/reproducible-experiment-manifests || true
          git push origin --delete docs/roadmap-after-21 || true
