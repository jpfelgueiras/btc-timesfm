name: Hourly BTC Forecast Dispatcher

on:
  workflow_dispatch:
  schedule:
    # Dispatch shortly after each completed UTC hour. The production forecast
    # workflow is invoked manually so X posting stays disabled.
    - cron: "7 * * * *"

permissions:
  actions: write
  contents: read

env:
  HISTORY_RELEASE_TAG: forecast-history-v1

concurrency:
  group: hourly-btc-forecast-dispatch
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/python-setup

      - name: Dispatch independent history backup refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$HISTORY_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if ! gh workflow run independent-history-backup-refresh.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main; then
              echo "::warning::Could not dispatch the independent history backup refresh."
            fi
          else
            echo "No durable history Release exists yet; skipping backup refresh."
          fi

      - name: Dispatch production forecast without X posting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run forecast.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f post_to_x=false
