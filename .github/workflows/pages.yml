name: BTC Forecast GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Rebuild hourly as a fallback even if the forecast workflow is delayed.
    - cron: "17 * * * *"
  workflow_run:
    workflows: ["BTC TimesFM 3 Forecast"]
    types: [completed]

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  HISTORY_RELEASE_TAG: forecast-history-v1

jobs:
  build:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - uses: ./.github/actions/python-setup

      - name: Download durable forecast history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .state
          gh release download "$HISTORY_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'forecast_history.sqlite.gz' \
            --dir .state
          gzip -df .state/forecast_history.sqlite.gz

      - name: Generate static forecast site
        run: |
          PYTHONPATH=src python -m btc_timesfm.web.static_site \
            --db .state/forecast_history.sqlite \
            --output-dir site

      - name: Validate site output contract
        run: |
          PYTHONPATH=src python -m btc_timesfm.web.contract_validation site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
