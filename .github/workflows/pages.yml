name: BTC Forecast GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Rebuild hourly as a fallback even if the forecast workflow is delayed.
    - cron: "17 * * * *"
  workflow_run:
    workflows: ["BTC TimesFM 3 Forecast"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  HISTORY_RELEASE_TAG: forecast-history-v1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Download durable forecast history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .state
          gh release download "$HISTORY_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'forecast_history.sqlite.gz' \
            --dir .state
          gzip -df .state/forecast_history.sqlite.gz

      - name: Generate static forecast site
        run: |
          PYTHONPATH=src python -m btc_timesfm.web.static_site \
            --db .state/forecast_history.sqlite \
            --output-dir site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
