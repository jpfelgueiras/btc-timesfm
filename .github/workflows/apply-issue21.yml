name: Apply issue 21 integration patch

on:
  push:
    branches:
      - feature/reproducible-experiment-manifests

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/reproducible-experiment-manifests

      - name: Apply source patch
        run: |
          if grep -q 'seed_everything' btc_forecast.py; then
            echo 'Issue 21 source patch already applied.'
          else
            python apply_issue21_patch.py
          fi

      - name: Format Python files
        run: |
          pip install 'ruff>=0.12,<1'
          ruff format experiment_manifest.py btc_forecast.py backtest.py history_migrations.py history_store.py test_experiment_manifest.py test_history_migrations.py test_history_store.py apply_issue21_patch.py

      - name: Commit integration changes
        run: |
          if git diff --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add btc_forecast.py backtest.py history_migrations.py history_store.py test_history_migrations.py test_history_store.py pyproject.toml .github/workflows/tests.yml experiment_manifest.py test_experiment_manifest.py apply_issue21_patch.py
          git commit -m 'feat: integrate reproducible experiment manifests'
          git push origin HEAD:feature/reproducible-experiment-manifests
