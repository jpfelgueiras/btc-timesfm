name: Weekly Forecast Optimizer

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical days to evaluate"
        required: false
        default: "120"
        type: string
      samples:
        description: "Walk-forward forecast origins"
        required: false
        default: "48"
        type: string
  schedule:
    # Weekly research run. Keep it away from the production forecast's minute 37.
    - cron: "17 4 * * 0"

permissions:
  contents: read

concurrency:
  group: btc-timesfm-weekly-optimizer
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: timesfm-3-${{ runner.os }}-v1
          restore-keys: |
            timesfm-3-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bounded walk-forward optimization
        run: |
          python optimizer.py \
            --days "${{ inputs.days || '120' }}" \
            --samples "${{ inputs.samples || '48' }}"

      - name: Add optimizer summary
        if: always() && hashFiles('optimizer_summary.md') != ''
        run: cat optimizer_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload optimizer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-optimizer-${{ github.run_id }}
          path: |
            optimizer_report.json
            optimizer_summary.md
          if-no-files-found: warn
          retention-days: 90
