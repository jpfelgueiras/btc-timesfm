name: Weekly Forecast Optimizer

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical days to evaluate"
        required: false
        default: "120"
        type: string
      samples:
        description: "Walk-forward forecast origins"
        required: false
        default: "48"
        type: string
  schedule:
    # Weekly research run. Keep it away from the production forecast's minute 37.
    - cron: "17 4 * * 0"

permissions:
  contents: read

env:
  HISTORY_RELEASE_TAG: forecast-history-v1

concurrency:
  group: btc-timesfm-weekly-optimizer
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/python-setup
        with:
          dependency-set: runtime

      - name: Restore production health snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .state
          if gh release view "$HISTORY_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$HISTORY_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'pipeline_health.json' \
              --dir .state >/dev/null 2>&1 || true
          fi

      - name: Cache Hugging Face model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/huggingface
          key: timesfm-3-${{ runner.os }}-v1
          restore-keys: |
            timesfm-3-${{ runner.os }}-

      - name: Validate historical data and run bounded optimization
        run: |
          PYTHONPATH=src python -m btc_timesfm.ops.validated_entrypoints optimizer \
            --days "${{ inputs.days || '120' }}" \
            --samples "${{ inputs.samples || '48' }}"

      - name: Attach leakage-safe interval diagnostics
        if: hashFiles('optimizer_report.json') != ''
        run: PYTHONPATH=src python -m btc_timesfm.research.champion_challenger_intervals

      - name: Evaluate formal promotion policy
        if: hashFiles('optimizer_report.json') != ''
        run: PYTHONPATH=src python -m btc_timesfm.ops.promotion_policy

      - name: Build champion-vs-challenger report
        if: hashFiles('optimizer_report.json') != ''
        run: PYTHONPATH=src python -m btc_timesfm.research.champion_challenger

      - name: Add market data validation summary
        if: always() && hashFiles('market_data_validation.json') != ''
        run: |
          echo '## Market data validation' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat market_data_validation.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Add optimizer summary
        if: always() && hashFiles('optimizer_summary.md') != ''
        run: cat optimizer_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Add promotion policy decision
        if: always() && hashFiles('promotion_summary.md') != ''
        run: cat promotion_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Add champion-vs-challenger summary
        if: always() && hashFiles('champion_challenger_summary.md') != ''
        run: cat champion_challenger_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload optimizer report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: btc-optimizer-${{ github.run_id }}
          path: |
            optimizer_report.json
            optimizer_summary.md
            promotion_decision.json
            promotion_summary.md
            market_data_validation.json
            .state/pipeline_health.json
          if-no-files-found: warn
          retention-days: 90

      - name: Retain champion-vs-challenger report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: btc-champion-challenger-${{ github.run_id }}
          path: |
            champion_challenger_report.json
            champion_challenger_summary.md
            optimizer_report.json
            promotion_decision.json
          if-no-files-found: warn
          retention-days: 90
