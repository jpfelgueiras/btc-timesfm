name: Forecast history disaster-recovery drill

on:
  workflow_dispatch:
  schedule:
    - cron: "43 6 * * 1"

permissions:
  contents: read
  issues: write

concurrency:
  group: btc-timesfm-forecast
  cancel-in-progress: false

env:
  HISTORY_RELEASE_TAG: forecast-history-v1
  HISTORY_INDEPENDENT_BACKUP_URI: ${{ vars.HISTORY_INDEPENDENT_BACKUP_URI }}
  RUNBOOK_PATH: docs/DISASTER_RECOVERY.md

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/python-setup
        with:
          dependency-set: runtime

      - name: Restore latest backup archive to scratch storage
        id: independent_restore
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.HISTORY_BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HISTORY_BACKUP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.HISTORY_BACKUP_AWS_REGION }}
        run: |
          set -euo pipefail
          mkdir -p .drill
          if [ -z "$HISTORY_INDEPENDENT_BACKUP_URI" ]; then
            echo "Independent backup is not configured; set HISTORY_INDEPENDENT_BACKUP_URI." >&2
            exit 1
          fi
          PYTHONPATH=src python -m btc_timesfm.history.independent_backup restore \
            --uri "$HISTORY_INDEPENDENT_BACKUP_URI" \
            --output .drill/independent-backup.sqlite.gz > .drill/independent_restore.json

      - name: Run non-mutating recovery drill
        id: drill
        run: |
          PYTHONPATH=src python -m btc_timesfm.history.disaster_recovery \
            --archive .drill/independent-backup.sqlite.gz \
            --report .drill/disaster_recovery_report.json

      - name: Record successful independent restore
        if: steps.drill.outcome == 'success'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HISTORY_BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HISTORY_BACKUP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.HISTORY_BACKUP_AWS_REGION }}
        run: |
          PYTHONPATH=src python -m btc_timesfm.history.independent_backup record-restore \
            --uri "$HISTORY_INDEPENDENT_BACKUP_URI" > .drill/restore_receipt.json

      - name: Add drill report to job summary
        if: always() && hashFiles('.drill/disaster_recovery_report.json') != ''
        run: |
          echo '## Forecast history disaster-recovery drill' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat .drill/disaster_recovery_report.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload drill report
        if: always() && (hashFiles('.drill/disaster_recovery_report.json') != '' || hashFiles('.drill/independent_restore.json') != '')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: forecast-history-disaster-recovery
          path: |
            .drill/disaster_recovery_report.json
            .drill/independent_restore.json
            .drill/restore_receipt.json
          retention-days: 90

      - name: Create failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Forecast history disaster-recovery drill failed"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "The independent recovery drill failed in run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Follow [$RUNBOOK_PATH]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/$RUNBOOK_PATH)."
          fi
          exit 1
