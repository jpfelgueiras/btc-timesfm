name: BTC Forecast Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical days to download"
        required: false
        default: "90"
        type: string
      samples:
        description: "Walk-forward forecast samples"
        required: false
        default: "60"
        type: string

permissions:
  contents: read

concurrency:
  group: btc-backtest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/python-setup
        with:
          requirements-file: requirements.txt

      - name: Cache Hugging Face model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/huggingface
          key: timesfm-3-${{ runner.os }}-v1
          restore-keys: |
            timesfm-3-${{ runner.os }}-

      - name: Validate historical data and run walk-forward backtest
        run: PYTHONPATH=src python -m btc_timesfm.ops.validated_entrypoints backtest --days "${{ inputs.days }}" --samples "${{ inputs.samples }}"

      - name: Add validation to summary
        if: always() && hashFiles('market_data_validation.json') != ''
        run: |
          echo '## Market data validation' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat market_data_validation.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Add report to summary
        if: hashFiles('backtest_report.json') != ''
        run: |
          echo '## BTC forecast backtest' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat backtest_report.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: btc-backtest-${{ github.run_id }}
          path: |
            backtest_report.json
            market_data_validation.json
          if-no-files-found: warn
          retention-days: 30
