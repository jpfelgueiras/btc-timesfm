name: BTC Forecast Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical days to download"
        required: false
        default: "90"
        type: string
      samples:
        description: "Walk-forward forecast samples"
        required: false
        default: "60"
        type: string

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Hugging Face model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: timesfm-3-${{ runner.os }}-v1
          restore-keys: |
            timesfm-3-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate historical data and run walk-forward backtest
        run: python validated_entrypoints.py backtest --days "${{ inputs.days }}" --samples "${{ inputs.samples }}"

      - name: Add validation to summary
        if: always() && hashFiles('market_data_validation.json') != ''
        run: |
          echo '## Market data validation' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat market_data_validation.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Add report to summary
        if: hashFiles('backtest_report.json') != ''
        run: |
          echo '## BTC forecast backtest' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat backtest_report.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: btc-backtest-${{ github.run_id }}
          path: |
            backtest_report.json
            market_data_validation.json
          if-no-files-found: warn
          retention-days: 30
