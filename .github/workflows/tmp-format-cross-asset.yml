name: Temporary format cross-asset files

on:
  push:
    branches:
      - feature/cross-asset-macro-signals
    paths:
      - .github/workflows/tmp-format-cross-asset.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/cross-asset-macro-signals
      - name: Format files
        run: |
          python -m pip install 'ruff>=0.16.5,<1'
          ruff format cross_asset_ablation.py test_cross_asset_signals.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cross_asset_ablation.py test_cross_asset_signals.py
          if ! git diff --cached --quiet; then
            git commit -m "Format cross-asset research files"
            git push origin HEAD:feature/cross-asset-macro-signals
          fi
