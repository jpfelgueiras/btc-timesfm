name: Fix issue 31 CI

on:
  push:
    branches:
      - feature/conformal-calibration

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/conformal-calibration
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Apply fixes and format
        run: |
          python3 _fix_issue31.py
          pip install 'ruff>=0.16.5,<1'
          ruff format conformal_calibration.py test_conformal_calibration.py adaptive_weighting.py btc_forecast.py
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix conformal calibration CI"
          git push origin HEAD:feature/conformal-calibration
