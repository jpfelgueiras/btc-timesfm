name: Format market-data fix

on:
  push:
    branches:
      - fix/market-data-resilience
    paths:
      - .github/workflows/format-market-data-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/market-data-resilience

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: pip install -r requirements-test.txt

      - name: Apply Ruff formatting
        run: ruff format market_data_sources.py test_market_data_sources.py

      - name: Commit formatted files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market_data_sources.py test_market_data_sources.py
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
          else
            git commit -m 'Apply Ruff formatting'
            git push origin HEAD:fix/market-data-resilience
          fi
