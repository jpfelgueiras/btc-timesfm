name: Fix issue 41 files

on:
  push:
    branches:
      - feature/optimizer-promotion-policy

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Fix numeric type narrowing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('promotion_policy.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _float(value: object, name: str) -> float:\n    if value is None:\n        raise ValueError(f"Missing numeric value for {name}")\n    return float(value)\n'''
          new = '''def _float(value: object, name: str) -> float:\n    if isinstance(value, bool) or not isinstance(value, (int, float, str)):\n        raise ValueError(f"Missing or invalid numeric value for {name}")\n    try:\n        return float(value)\n    except ValueError as exc:\n        raise ValueError(f"Invalid numeric value for {name}: {value!r}") from exc\n'''
          if old not in text:
              raise SystemExit('Expected _float implementation not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - run: pip install 'ruff<1,>=0.16.5'
      - run: ruff format promotion_policy.py test_promotion_policy.py
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add promotion_policy.py test_promotion_policy.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix and format promotion policy'
          git push
