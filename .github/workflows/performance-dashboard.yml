name: Forecast performance dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 05 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: forecast-performance-dashboard
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/python-setup

      - name: Restore durable forecast history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .state
          gh release download forecast-history-v1 \
            --pattern forecast_history.sqlite.gz \
            --output .state/forecast_history.sqlite.gz
          gzip -dc .state/forecast_history.sqlite.gz > .state/forecast_history.sqlite
          gh run download --repo "$GITHUB_REPOSITORY" \
            --name forecast-history-disaster-recovery \
            --dir .state/disaster-recovery || true

      - name: Verify durable history
        run: PYTHONPATH=src python -m btc_timesfm.history.history_store --db .state/forecast_history.sqlite verify

      - name: Generate dashboard
        run: |
          mkdir -p dashboard
          PYTHONPATH=src python -m btc_timesfm.research.performance_dashboard \
            --db .state/forecast_history.sqlite \
            --json dashboard/performance_dashboard.json \
            --markdown dashboard/performance_dashboard.md \
            --html dashboard/performance_dashboard.html \
            --disaster-recovery-report .state/disaster-recovery/disaster_recovery_report.json

      - name: Add dashboard to Actions summary
        run: cat dashboard/performance_dashboard.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: forecast-performance-dashboard
          path: dashboard/
          retention-days: 90
