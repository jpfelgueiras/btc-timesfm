name: Format benchmark branch

on:
  push:
    branches:
      - feature/benchmark-suite

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: pip install 'ruff>=0.16.5,<1'
      - name: Format changed Python files
        run: ruff format benchmarks.py backtest.py test_benchmarks.py test_backtest.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks.py backtest.py test_benchmarks.py test_backtest.py
          git commit -m 'Apply Ruff formatting'
          git push
