name: Format static site generator

on:
  push:
    branches: [feature/github-pages-dashboard]
    paths: ['.github/workflows/_format_static_site.yml']

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/github-pages-dashboard
      - name: Format static site generator
        run: |
          python -m pip install 'ruff==0.16.6'
          ruff format src/btc_timesfm/web/static_site.py
      - name: Commit formatted source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/btc_timesfm/web/static_site.py
          if ! git diff --cached --quiet; then
            git commit -m 'Format static site generator'
            git push origin HEAD:feature/github-pages-dashboard
          fi
