name: BTC TimesFM 3 Forecast

on:
  workflow_dispatch:
    inputs:
      post_to_x:
        description: "Post this manual run to X"
        required: false
        default: false
        type: boolean
  schedule:
    # Wake up hourly away from the top of the hour. A guard below only runs
    # the expensive forecast when at least two completed candle hours elapsed.
    - cron: "37 * * * *"

permissions:
  # Read the source and update the dedicated forecast-history Release assets.
  contents: write

env:
  HISTORY_RELEASE_TAG: forecast-history-v1
  HISTORY_BACKUP_KEEP: "7"
  HISTORY_BACKUP_MAX_BYTES: "52428800"
  HISTORY_BACKUP_MAX_TOTAL_BYTES: "262144000"

concurrency:
  group: btc-timesfm-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize forecast observability
        run: python3 observability.py init --run-type production_forecast

      - name: Restore forecast history
        uses: actions/cache/restore@v6
        with:
          path: .state/previous_forecast.json
          key: btc-forecast-state-${{ github.run_id }}
          restore-keys: |
            btc-forecast-state-

      - name: Decide whether forecast is due
        id: due
        run: python3 schedule_guard.py

      - name: Explain skipped schedule
        if: steps.due.outputs.run_forecast != 'true'
        env:
          SKIP_REASON: ${{ steps.due.outputs.reason }}
        run: |
          python3 observability.py skip --reason "$SKIP_REASON"
          echo '## Forecast skipped' >> "$GITHUB_STEP_SUMMARY"
          echo "$SKIP_REASON" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore durable production state
        if: steps.due.outputs.run_forecast == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .state
          if gh release view "$HISTORY_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$HISTORY_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'forecast_history.sqlite.gz' \
              --dir .state
            gzip -df .state/forecast_history.sqlite.gz
            cp .state/forecast_history.sqlite .state/forecast_history.previous.sqlite
            gh release download "$HISTORY_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'x_post_registry.json' \
              --dir .state >/dev/null 2>&1 || true
            gh release download "$HISTORY_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'pipeline_health.json' \
              --dir .state >/dev/null 2>&1 || true
            touch .state/history_restored_from_release
            echo "Restored durable production state from release $HISTORY_RELEASE_TAG"
          else
            echo "No durable history release exists yet; the first forecast will create it."
          fi

      - name: Set up Python
        if: steps.due.outputs.run_forecast == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Migrate and verify durable history schema
        if: steps.due.outputs.run_forecast == 'true'
        run: python history_store.py --db .state/forecast_history.sqlite verify

      - name: Cache Hugging Face model
        if: steps.due.outputs.run_forecast == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: timesfm-3-${{ runner.os }}-v1
          restore-keys: |
            timesfm-3-${{ runner.os }}-

      - name: Install dependencies
        if: steps.due.outputs.run_forecast == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate market data and forecast BTC
        id: forecast_run
        if: steps.due.outputs.run_forecast == 'true'
        run: python validated_entrypoints.py forecast

      - name: Observe forecast and data health
        if: always() && steps.due.outputs.run_forecast == 'true'
        env:
          FORECAST_OUTCOME: ${{ steps.forecast_run.outcome }}
        run: python3 pipeline_health.py observe-forecast --outcome "$FORECAST_OUTCOME"

      - name: Add drift detection to job summary
        if: always() && steps.due.outputs.run_forecast == 'true' && hashFiles('drift_summary.md') != ''
        run: cat drift_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Add market data validation to job summary
        if: always() && steps.due.outputs.run_forecast == 'true' && hashFiles('market_data_validation.json') != ''
        run: |
          echo '## Market data validation' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat market_data_validation.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Add market data source to job summary
        if: always() && steps.due.outputs.run_forecast == 'true' && hashFiles('market_data_source.json') != ''
        run: |
          echo '## Market data provider selection' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat market_data_source.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Format visual X post
        if: steps.due.outputs.run_forecast == 'true' && steps.forecast_run.outcome == 'success'
        run: python format_tweet.py

      - name: Preliminary publication health gate
        id: health_pre
        if: always() && steps.due.outputs.run_forecast == 'true' && (github.event_name == 'schedule' || inputs.post_to_x)
        run: python3 pipeline_health.py gate --ignore-stage history

      - name: Preflight and reserve X publication
        id: x_prepare
        if: steps.due.outputs.run_forecast == 'true' && steps.forecast_run.outcome == 'success' && (github.event_name == 'schedule' || inputs.post_to_x) && steps.health_pre.outputs.allow == 'true'
        env:
          X_COOKIES_JSON: ${{ secrets.X_COOKIES_JSON }}
        run: python post_to_x.py prepare

      - name: Observe X preflight health
        if: always() && steps.due.outputs.run_forecast == 'true' && (github.event_name == 'schedule' || inputs.post_to_x) && hashFiles('x_post_status.json') != ''
        run: python3 pipeline_health.py observe-x --phase preflight

      - name: Verify and export durable history
        if: steps.due.outputs.run_forecast == 'true' && steps.forecast_run.outcome == 'success'
        run: |
          set -euo pipefail
          python history_store.py --db .state/forecast_history.sqlite verify
          python history_store.py --db .state/forecast_history.sqlite export \
            --format csv --output .state/forecast_history.csv
          gzip -c .state/forecast_history.sqlite > .state/forecast_history.sqlite.gz
          gzip -c .state/forecast_history.csv > .state/forecast_history.csv.gz

          canonical_bytes="$(stat -c%s .state/forecast_history.sqlite.gz)"
          if [ "$canonical_bytes" -gt "$HISTORY_BACKUP_MAX_BYTES" ]; then
            echo "Compressed canonical history is ${canonical_bytes} bytes; limit is ${HISTORY_BACKUP_MAX_BYTES}." >&2
            exit 1
          fi

          if [ -f .state/forecast_history.previous.sqlite ]; then
            python history_backup.py create \
              --source .state/forecast_history.previous.sqlite \
              --output .state/forecast_history.previous.sqlite.gz \
              --max-bytes "$HISTORY_BACKUP_MAX_BYTES"
          fi

      - name: Publish durable forecast history
        id: history_publish
        if: steps.due.outputs.run_forecast == 'true' && steps.forecast_run.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            .state/forecast_history.sqlite.gz
            .state/forecast_history.csv.gz
          )
          if [ -f .state/forecast_history.previous.sqlite.gz ]; then
            assets+=(.state/forecast_history.previous.sqlite.gz)
          fi
          if [ -f .state/x_post_registry.json ]; then
            assets+=(.state/x_post_registry.json)
          fi
          if [ -f .state/pipeline_health.json ]; then
            assets+=(.state/pipeline_health.json)
          fi

          if [ -f .state/history_restored_from_release ]; then
            # Preserve and verify a unique generation of the known-good database
            # before replacing the canonical Release asset.
            generation="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}"
            backup_name="forecast_history.backup-${generation}.sqlite.gz"
            versioned_backup=".state/${backup_name}"
            cp .state/forecast_history.previous.sqlite.gz "$versioned_backup"

            gh release upload "$HISTORY_RELEASE_TAG" "$versioned_backup" \
              --repo "$GITHUB_REPOSITORY"

            rm -rf .state/backup_verify
            mkdir -p .state/backup_verify
            gh release download "$HISTORY_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$backup_name" \
              --dir .state/backup_verify
            python history_backup.py verify \
              --archive ".state/backup_verify/${backup_name}" \
              --max-bytes "$HISTORY_BACKUP_MAX_BYTES" \
              > .state/uploaded_backup_verification.json

            # Only after the new rollback generation has been re-downloaded and
            # verified may the current canonical assets be replaced.
            gh release upload "$HISTORY_RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber

            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$HISTORY_RELEASE_TAG" \
              --jq '.assets | map({id: .id, name: .name, size: .size, created_at: .created_at})' \
              > .state/release_assets.json
            python history_backup.py retention-plan \
              --assets-json .state/release_assets.json \
              --keep "$HISTORY_BACKUP_KEEP" \
              --max-total-bytes "$HISTORY_BACKUP_MAX_TOTAL_BYTES" \
              > .state/backup_retention_plan.json

            python - <<'PY' > .state/delete_backup_asset_ids.txt
          import json

          with open(".state/backup_retention_plan.json", encoding="utf-8") as handle:
              plan = json.load(handle)
          for asset in plan["delete"]:
              print(asset["id"])
          PY
            while read -r asset_id; do
              if [ -n "$asset_id" ]; then
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
              fi
            done < .state/delete_backup_asset_ids.txt
          else
            gh release create "$HISTORY_RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'BTC forecast history datastore' \
              --notes 'Machine-managed durable history for production BTC forecasts. Do not edit assets manually.' \
              --latest=false
          fi

      - name: Observe durable history health
        if: always() && steps.due.outputs.run_forecast == 'true' && steps.forecast_run.outcome == 'success'
        env:
          HISTORY_OUTCOME: ${{ steps.history_publish.outcome }}
        run: python3 pipeline_health.py observe-history --outcome "$HISTORY_OUTCOME"

      - name: Persist current pipeline health
        id: health_persist
        if: always() && steps.due.outputs.run_forecast == 'true' && steps.forecast_run.outcome == 'success' && hashFiles('.state/pipeline_health.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$HISTORY_RELEASE_TAG" .state/pipeline_health.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Final publication health gate
        id: health_gate
        if: always() && steps.due.outputs.run_forecast == 'true' && (github.event_name == 'schedule' || inputs.post_to_x)
        run: python3 pipeline_health.py gate

      - name: Add forecast to job summary
        if: steps.due.outputs.run_forecast == 'true' && steps.forecast_run.outcome == 'success'
        run: |
          echo '## BTC TimesFM 3 forecast' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat forecast.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '## Durable history' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python history_store.py --db .state/forecast_history.sqlite stats >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f .state/uploaded_backup_verification.json ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '### Verified history backup' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat .state/uploaded_backup_verification.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .state/backup_retention_plan.json ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '### History backup retention' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat .state/backup_retention_plan.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '## X post' >> "$GITHUB_STEP_SUMMARY"
          cat tweet.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Save forecast history
        if: steps.due.outputs.run_forecast == 'true' && steps.forecast_run.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .state/previous_forecast.json
          key: btc-forecast-state-${{ github.run_id }}

      - name: Post forecast to X with Twikit
        id: x_publish
        if: steps.due.outputs.run_forecast == 'true' && steps.forecast_run.outcome == 'success' && (github.event_name == 'schedule' || inputs.post_to_x) && steps.x_prepare.outputs.publish == 'true' && steps.health_persist.outcome == 'success' && steps.health_gate.outputs.allow == 'true'
        env:
          X_COOKIES_JSON: ${{ secrets.X_COOKIES_JSON }}
        run: |
          python observability.py run-stage \
            --stage x_post \
            --success-counter successful_posts \
            -- python post_to_x.py publish

      - name: Observe X publication health
        if: always() && steps.due.outputs.run_forecast == 'true' && (github.event_name == 'schedule' || inputs.post_to_x) && steps.x_publish.outcome != 'skipped' && hashFiles('x_post_status.json') != ''
        run: python3 pipeline_health.py observe-x --phase publish

      - name: Persist X and health metadata
        if: always() && steps.due.outputs.run_forecast == 'true' && steps.forecast_run.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=()
          if [ -f .state/x_post_registry.json ]; then
            assets+=(.state/x_post_registry.json)
          fi
          if [ -f .state/pipeline_health.json ]; then
            assets+=(.state/pipeline_health.json)
          fi
          if [ "${#assets[@]}" -gt 0 ]; then
            gh release upload "$HISTORY_RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi

      - name: Refresh pipeline health report
        if: always() && steps.due.outputs.run_forecast == 'true'
        run: python3 pipeline_health.py report

      - name: Send optional pipeline health notification
        if: always() && steps.due.outputs.run_forecast == 'true'
        continue-on-error: true
        env:
          PIPELINE_HEALTH_WEBHOOK_URL: ${{ secrets.PIPELINE_HEALTH_WEBHOOK_URL }}
        run: python3 pipeline_health.py notify

      - name: Add pipeline health to job summary
        if: always() && steps.due.outputs.run_forecast == 'true' && hashFiles('pipeline_health_summary.md') != ''
        run: cat pipeline_health_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Add X posting status to job summary
        if: always() && steps.due.outputs.run_forecast == 'true' && hashFiles('x_post_status.json') != ''
        run: |
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### X posting result' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat x_post_status.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Finalize observability and add summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "failure" ]; then
            python3 observability.py finalize --status failed
          else
            python3 observability.py finalize --status success --preserve-terminal
          fi
          python3 observability.py summary --append "$GITHUB_STEP_SUMMARY"

      - name: Upload forecast
        if: always() && steps.due.outputs.run_forecast == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: btc-forecast-${{ github.run_id }}
          path: |
            forecast.json
            tweet.txt
            x_post_status.json
            market_data_validation.json
            market_data_source.json
            drift_report.json
            drift_summary.md
            pipeline_health_report.json
            pipeline_health_summary.md
            forecast_observability.json
            forecast_observability.jsonl
            .state/pipeline_health.json
            .state/x_post_registry.json
            .state/x_post_prepared.json
            .state/uploaded_backup_verification.json
            .state/backup_retention_plan.json
          if-no-files-found: warn
          retention-days: 7
