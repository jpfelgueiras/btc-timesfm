name: BTC TimesFM 3 Forecast

on:
  workflow_dispatch:
  schedule:
    # Every 2 hours at minute 17 (UTC)
    - cron: "17 */2 * * *"

permissions:
  contents: read

concurrency:
  group: btc-timesfm-forecast
  cancel-in-progress: true

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: timesfm-3-${{ runner.os }}-v1
          restore-keys: |
            timesfm-3-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Forecast BTC
        run: python btc_forecast.py

      - name: Add forecast to job summary
        run: |
          echo '## BTC TimesFM 3 forecast' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat forecast.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload forecast
        uses: actions/upload-artifact@v4
        with:
          name: btc-forecast-${{ github.run_id }}
          path: forecast.json
          retention-days: 7
