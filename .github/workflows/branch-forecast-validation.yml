name: Branch forecast validation

on:
  push:
    branches:
      - fix/market-data-resilience
    paths:
      - .github/workflows/branch-forecast-validation.yml

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Hugging Face model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: timesfm-3-${{ runner.os }}-v1
          restore-keys: |
            timesfm-3-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run live forecast
        run: python validated_entrypoints.py forecast

      - name: Format visual post
        run: python format_tweet.py

      - name: Show forecast
        run: |
          echo '## Forecast' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat forecast.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '## X preview' >> "$GITHUB_STEP_SUMMARY"
          cat tweet.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation output
        uses: actions/upload-artifact@v7
        with:
          name: branch-forecast-validation-${{ github.run_id }}
          path: |
            forecast.json
            tweet.txt
            market_data_validation.json
            market_data_source.json
          retention-days: 3
