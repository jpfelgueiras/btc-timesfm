name: Sync issue 36 branch with main

on:
  push:
    branches: [feature/cross-asset-macro-signals]
    paths: ['.github/workflows/_sync_issue36_main.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/cross-asset-macro-signals
          fetch-depth: 0
      - name: Merge current main into feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:feature/cross-asset-macro-signals
