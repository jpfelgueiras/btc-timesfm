name: CI quality gates

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run unit tests with coverage
        run: |
          coverage run -m unittest discover -s . -p 'test_*.py' -v
          coverage report --format=markdown --fail-under=0 > coverage.md
          coverage report --fail-under=75

      - name: Add coverage to summary
        if: always() && hashFiles('coverage.md') != ''
        run: |
          echo '## Test coverage' >> "$GITHUB_STEP_SUMMARY"
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Coverage floor: **75%** across the configured critical modules.' >> "$GITHUB_STEP_SUMMARY"

  lint-format:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install quality dependencies
        run: pip install -r requirements-test.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install quality dependencies
        run: pip install -r requirements-test.txt

      - name: Type check critical modules
        run: |
          mypy --follow-imports=skip \
            drift_detection.py \
            experiment_manifest.py \
            history_audit.py \
            history_backup.py \
            history_migrations.py \
            history_store.py \
            market_data_sources.py \
            market_data_validation.py \
            observability.py \
            performance_dashboard.py \
            pipeline_health.py \
            post_to_x.py \
            schedule_guard.py \
            statistical_significance.py \
            x_post_registry.py
