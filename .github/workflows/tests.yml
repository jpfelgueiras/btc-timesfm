name: CI quality gates

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  quality-gates:
    name: Unit tests + quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Unit tests
        id: unit
        continue-on-error: true
        run: PYTHONPATH=src coverage run -m unittest discover -s tests -p 'test_*.py' -v

      - name: Coverage floor
        id: coverage
        if: always()
        continue-on-error: true
        run: |
          coverage report --format=markdown --fail-under=0 > coverage.md
          coverage report --fail-under=75

      - name: Add coverage to summary
        if: always() && hashFiles('coverage.md') != ''
        run: |
          echo '## Test coverage' >> "$GITHUB_STEP_SUMMARY"
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Coverage floor: **75%** across the configured critical modules.' >> "$GITHUB_STEP_SUMMARY"

      - name: Ruff lint
        id: lint
        if: always()
        continue-on-error: true
        run: ruff check .

      - name: Ruff format check
        id: format
        if: always()
        continue-on-error: true
        run: ruff format --check .

      - name: Type check critical modules
        id: typecheck
        if: always()
        continue-on-error: true
        run: |
          mypy --follow-imports=skip \
            champion_challenger.py \
            champion_challenger_intervals.py \
            conformal_calibration.py \
            correlation_backtest.py \
            correlation_weighting.py \
            cross_asset_ablation.py \
            cross_asset_signals.py \
            derivatives_ablation.py \
            derivatives_signals.py \
            diversified_model.py \
            drift_detection.py \
            experiment_manifest.py \
            forecast_confidence.py \
            history_audit.py \
            history_backup.py \
            history_migrations.py \
            history_store.py \
            market_data_sources.py \
            market_data_validation.py \
            microstructure_ablation.py \
            microstructure_signals.py \
            observability.py \
            performance_dashboard.py \
            pipeline_health.py \
            post_to_x.py \
            promotion_policy.py \
            regime_backtest.py \
            regime_detection.py \
            schedule_guard.py \
            statistical_significance.py \
            x_post_registry.py

      - name: Enforce quality gates
        if: always()
        env:
          UNIT: ${{ steps.unit.outcome }}
          COVERAGE: ${{ steps.coverage.outcome }}
          LINT: ${{ steps.lint.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
        run: |
          failed=0
          for gate in UNIT COVERAGE LINT FORMAT TYPECHECK; do
            outcome="${!gate}"
            echo "$gate: $outcome"
            if [ "$outcome" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"

  # Compatibility aliases retained for the required status-check names on main.
  unit-tests-required-compat:
    name: Unit tests
    needs: quality-gates
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Mirror quality-gate result
        env:
          RESULT: ${{ needs.quality-gates.result }}
        run: |
          echo "Unit tests + quality: $RESULT"
          test "$RESULT" = "success"

  unit-tests-legacy-compat:
    name: unit-tests
    needs: quality-gates
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Mirror quality-gate result
        env:
          RESULT: ${{ needs.quality-gates.result }}
        run: |
          echo "Unit tests + quality: $RESULT"
          test "$RESULT" = "success"
