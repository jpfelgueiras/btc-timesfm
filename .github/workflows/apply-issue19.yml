name: Apply issue 19 integration patch

on:
  push:
    branches:
      - feature/history-schema-migrations

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/history-schema-migrations

      - name: Apply integration patch
        run: |
          if grep -q '^SCHEMA_VERSION = 1$' history_store.py; then
            python apply_issue19_patch.py
          else
            echo 'Issue 19 integration patch is already applied.'
          fi

      - name: Format Python files
        run: |
          pip install 'ruff>=0.12,<1'
          ruff format history_store.py history_migrations.py test_history_migrations.py apply_issue19_patch.py

      - name: Commit integration changes
        run: |
          if git diff --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history_store.py history_migrations.py test_history_migrations.py .github/workflows/forecast.yml apply_issue19_patch.py
          git commit -m 'feat: integrate history schema migrations'
          git push origin HEAD:feature/history-schema-migrations
