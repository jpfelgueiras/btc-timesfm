name: Format issue 44 implementation

on:
  push:
    branches: [feature/statistical-confidence-explanations]
    paths:
      - '.github/workflows/_format_issue44.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/statistical-confidence-explanations

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Format and add confidence module to type gate
        run: |
          python -m pip install 'ruff==0.16.6'
          ruff format forecast_confidence.py test_forecast_confidence.py
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/tests.yml')
          text = path.read_text(encoding='utf-8')
          needle = '            experiment_manifest.py \\\n'
          replacement = '            experiment_manifest.py \\\n            forecast_confidence.py \\\n'
          if '            forecast_confidence.py \\\n' not in text:
              if text.count(needle) != 1:
                  raise SystemExit('could not find unique mypy insertion point')
              text = text.replace(needle, replacement, 1)
              path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/_format_issue44.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forecast_confidence.py test_forecast_confidence.py .github/workflows/tests.yml
          git commit -m 'Format confidence implementation and type-check it'
          git push origin HEAD:feature/statistical-confidence-explanations
