name: Format issue 44 implementation

on:
  push:
    branches: [feature/statistical-confidence-explanations]
    paths:
      - '.github/workflows/_format_issue44.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/statistical-confidence-explanations

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Format confidence files
        run: |
          python -m pip install 'ruff==0.16.6'
          ruff format forecast_confidence.py test_forecast_confidence.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forecast_confidence.py test_forecast_confidence.py
          if git diff --cached --quiet; then
            echo 'Files already formatted.'
            exit 0
          fi
          git commit -m 'Format confidence implementation'
          git push origin HEAD:feature/statistical-confidence-explanations
