name: Patch issue 36 production integration

on:
  push:
    branches: [feature/cross-asset-macro-signals]
    paths: ['.github/workflows/_patch_issue36.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/cross-asset-macro-signals
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Integrate cross-asset snapshot
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('btc_forecast.py')
          text = path.read_text()
          replacements = [
              (
                  'from conformal_calibration import conformal_calibration_multiplier, evaluation_report\n',
                  'from conformal_calibration import conformal_calibration_multiplier, evaluation_report\nfrom cross_asset_signals import (\n    fetch_cross_asset_snapshot,\n    signal_manifest as cross_asset_manifest,\n)\n',
              ),
              (
                  'MICROSTRUCTURE_PATH = Path("microstructure_signal.json")\n',
                  'MICROSTRUCTURE_PATH = Path("microstructure_signal.json")\nCROSS_ASSET_PATH = Path("cross_asset_signal.json")\n',
              ),
              (
                  '        "microstructure_signals": output.get("microstructure_signals"),\n',
                  '        "microstructure_signals": output.get("microstructure_signals"),\n        "cross_asset_signals": output.get("cross_asset_signals"),\n',
              ),
              (
                  '    print(\n        f"Microstructure signals: {microstructure_snapshot[\'status\']} | "\n        f"features={len(microstructure_snapshot.get(\'features\', {}))}"\n    )\n\n    actuals = dict(zip(data.timestamps, map(float, data.closes), strict=True))\n',
                  '    print(\n        f"Microstructure signals: {microstructure_snapshot[\'status\']} | "\n        f"features={len(microstructure_snapshot.get(\'features\', {}))}"\n    )\n    cross_asset_snapshot = fetch_cross_asset_snapshot(forecast_origin, data)\n    CROSS_ASSET_PATH.write_text(\n        json.dumps(cross_asset_snapshot, indent=2, sort_keys=True) + "\\n",\n        encoding="utf-8",\n    )\n    print(\n        f"Cross-asset signals: {cross_asset_snapshot[\'status\']} | "\n        f"features={len(cross_asset_snapshot.get(\'features\', {}))}"\n    )\n\n    actuals = dict(zip(data.timestamps, map(float, data.closes), strict=True))\n',
              ),
              (
                  '    derivative_features = derivatives_snapshot.get("features", {})\n    microstructure_features = microstructure_snapshot.get("features", {})\n    market_features = engine_output.get("market_features")\n    if isinstance(market_features, dict):\n        for feature_group in (derivative_features, microstructure_features):\n',
                  '    derivative_features = derivatives_snapshot.get("features", {})\n    microstructure_features = microstructure_snapshot.get("features", {})\n    cross_asset_features = cross_asset_snapshot.get("features", {})\n    market_features = engine_output.get("market_features")\n    if isinstance(market_features, dict):\n        for feature_group in (\n            derivative_features,\n            microstructure_features,\n            cross_asset_features,\n        ):\n',
              ),
              (
                  '            "microstructure_signals": microstructure_manifest(microstructure_snapshot),\n',
                  '            "microstructure_signals": microstructure_manifest(microstructure_snapshot),\n            "cross_asset_signals": cross_asset_manifest(cross_asset_snapshot),\n',
              ),
              (
                  '        "microstructure_signals": microstructure_snapshot,\n',
                  '        "microstructure_signals": microstructure_snapshot,\n        "cross_asset_signals": cross_asset_snapshot,\n',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one match, found {text.count(old)} for {old[:100]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          python -m pip install 'ruff==0.16.6'
          ruff format btc_forecast.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add btc_forecast.py
          git commit -m 'Integrate cross-asset signals into production context'
          git push origin HEAD:feature/cross-asset-macro-signals
