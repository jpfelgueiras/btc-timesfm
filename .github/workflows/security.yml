name: Security audit

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/python-setup
        with:
          dependency-set: security

      - name: Audit Python dependencies
        run: |
          uv export --locked --no-default-groups --extra model --no-emit-project --format requirements-txt --output-file /tmp/runtime-audit.txt
          pip-audit -r /tmp/runtime-audit.txt --progress-spinner off

      - name: Check repository for credential leakage
        run: PYTHONPATH=src python -m btc_timesfm.ops.security_audit

      - name: Write summary
        if: always()
        run: |
          echo '## Security audit' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Python dependencies are checked against the Python Packaging Advisory Database via pip-audit.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Repository text and workflows are checked for common credential literals and unsafe environment-dump patterns.' >> "$GITHUB_STEP_SUMMARY"
          echo '- This workflow never prints repository secrets or cookie values.' >> "$GITHUB_STEP_SUMMARY"
