name: Security audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "requirements*.txt"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "security_audit.py"
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install audit tooling
        run: |
          python -m pip install --disable-pip-version-check -r requirements-security.txt

      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.txt --progress-spinner off

      - name: Check repository for credential leakage
        run: PYTHONPATH=src python -m btc_timesfm.ops.security_audit

      - name: Write summary
        if: always()
        run: |
          echo '## Security audit' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Python dependencies are checked against the Python Packaging Advisory Database via pip-audit.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Repository text and workflows are checked for common credential literals and unsafe environment-dump patterns.' >> "$GITHUB_STEP_SUMMARY"
          echo '- This workflow never prints repository secrets or cookie values.' >> "$GITHUB_STEP_SUMMARY"
