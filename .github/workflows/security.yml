name: Security audit

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: ./.github/actions/python-setup
        with:
          requirements-file: requirements-security.txt

      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.txt --progress-spinner off

      - name: Check repository for credential leakage
        run: PYTHONPATH=src python -m btc_timesfm.ops.security_audit

      - name: Write summary
        if: always()
        run: |
          echo '## Security audit' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Python dependencies are checked against the Python Packaging Advisory Database via pip-audit.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Repository text and workflows are checked for common credential literals and unsafe environment-dump patterns.' >> "$GITHUB_STEP_SUMMARY"
          echo '- This workflow never prints repository secrets or cookie values.' >> "$GITHUB_STEP_SUMMARY"
