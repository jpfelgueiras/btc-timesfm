name: Sync issue 33 with main

on:
  push:
    branches:
      - feature/production-drift-detection

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Merge latest main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ! git merge origin/main --no-edit; then
            conflicts=$(git diff --name-only --diff-filter=U)
            if [ "$conflicts" != ".github/workflows/tests.yml" ]; then
              echo "Unexpected merge conflicts: $conflicts"
              exit 1
            fi
            git checkout --theirs .github/workflows/tests.yml
            python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/tests.yml')
          text = path.read_text()
          needle = '          mypy --follow-imports=skip \\\n            experiment_manifest.py \\\n'
          replacement = '          mypy --follow-imports=skip \\\n            drift_detection.py \\\n            experiment_manifest.py \\\n'
          if text.count(needle) != 1:
              raise SystemExit('could not add drift_detection.py to merged type-check list')
          path.write_text(text.replace(needle, replacement, 1))
          PY
            git add .github/workflows/tests.yml
            git commit --no-edit
          fi
          git push origin HEAD:feature/production-drift-detection
