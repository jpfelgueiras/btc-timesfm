name: Temporary open branch cleanup

on:
  push:
    branches:
      - cleanup/open-branches-20260906
    paths:
      - maintenance_issue35_roadmap.py
      - .github/workflows/tmp-open-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cleanup/open-branches-20260906
          fetch-depth: 0
      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit
      - name: Refresh roadmap for completed issue 35
        run: python maintenance_issue35_roadmap.py
      - name: Commit and push cleanup
        run: |
          git add ROADMAP.md
          if ! git diff --cached --quiet; then
            git commit -m "Refresh roadmap after microstructure signals"
          fi
          git push origin HEAD:cleanup/open-branches-20260906
      - name: Delete merged microstructure branch
        run: |
          if git ls-remote --exit-code --heads origin feature/microstructure-signals >/dev/null 2>&1; then
            git push origin --delete feature/microstructure-signals
          fi
