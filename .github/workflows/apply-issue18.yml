name: Apply issue 18 integration patch

on:
  push:
    branches:
      - feature/redundant-market-data

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/redundant-market-data

      - name: Apply source patch
        run: |
          if grep -q 'fetch_kraken_hourly' btc_forecast.py; then
            python apply_issue18_patch.py
          else
            echo 'Issue 18 source patch already applied.'
          fi

      - name: Format Python files
        run: |
          pip install 'ruff>=0.12,<1'
          ruff format btc_forecast.py validated_entrypoints.py market_data_sources.py test_market_data_sources.py apply_issue18_patch.py

      - name: Commit integration changes
        run: |
          if git diff --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add btc_forecast.py validated_entrypoints.py market_data_sources.py test_market_data_sources.py apply_issue18_patch.py
          git commit -m 'feat: integrate redundant market data selection'
          git push origin HEAD:feature/redundant-market-data
