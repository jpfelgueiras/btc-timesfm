name: Independent forecast-history backup monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: btc-timesfm-forecast
  cancel-in-progress: false

env:
  HISTORY_INDEPENDENT_BACKUP_URI: ${{ vars.HISTORY_INDEPENDENT_BACKUP_URI }}

jobs:
  verify-independent-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/python-setup
        with:
          dependency-set: runtime

      - name: Verify independent backup and RPO
        id: check
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HISTORY_BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HISTORY_BACKUP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.HISTORY_BACKUP_AWS_REGION }}
        run: |
          set -euo pipefail
          if [ -z "$HISTORY_INDEPENDENT_BACKUP_URI" ]; then
            echo "Independent backup is not configured; set HISTORY_INDEPENDENT_BACKUP_URI." >&2
            exit 1
          fi
          PYTHONPATH=src python -m btc_timesfm.history.independent_backup check \
            --uri "$HISTORY_INDEPENDENT_BACKUP_URI" \
            --max-age-hours 2 \
            --report independent_backup_monitor.json > independent_backup_monitor.stdout.json

      - name: Add verification report to summary
        if: always() && hashFiles('independent_backup_monitor.json') != ''
        run: |
          echo '## Independent forecast-history backup' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat independent_backup_monitor.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification report
        if: always() && hashFiles('independent_backup_monitor.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: independent-history-backup-monitor-${{ github.run_id }}
          path: independent_backup_monitor.json
          retention-days: 90

      - name: Open deduplicated backup incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Independent forecast-history backup is stale or unverifiable"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "The 30-minute independent backup monitor failed in run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. It checks the S3 archive, manifest, checksum, SQLite/schema and the 2-hour warning threshold (before the 3-hour RPO). Inspect the run report and follow [the recovery runbook]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/DISASTER_RECOVERY.md). Secret values and the configured S3 URI are not included."
          fi
          exit 1
