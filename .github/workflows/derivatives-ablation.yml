name: BTC Derivatives Signal Ablation

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical days to evaluate (24-30)"
        required: false
        default: "30"
        type: string
      samples:
        description: "Walk-forward forecast origins"
        required: false
        default: "96"
        type: string
      min_train:
        description: "Minimum matured training rows"
        required: false
        default: "48"
        type: string
  schedule:
    # Weekly research run, away from production minute 37 and optimizer Sunday run.
    - cron: "47 5 * * 3"

permissions:
  contents: read

concurrency:
  group: btc-derivatives-ablation
  cancel-in-progress: false

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/python-setup
        with:
          requirements-file: requirements.txt

      - name: Run leakage-safe derivatives ablation
        run: |
          PYTHONPATH=src python -m btc_timesfm.research.derivatives_ablation \
            --days "${{ inputs.days || '30' }}" \
            --samples "${{ inputs.samples || '96' }}" \
            --min-train "${{ inputs.min_train || '48' }}"

      - name: Add derivatives ablation summary
        if: always() && hashFiles('derivatives_ablation_summary.md') != ''
        run: cat derivatives_ablation_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload derivatives ablation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: btc-derivatives-ablation-${{ github.run_id }}
          path: |
            derivatives_ablation_report.json
            derivatives_ablation_summary.md
          if-no-files-found: error
          retention-days: 90
