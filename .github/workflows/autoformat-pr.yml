name: Temporary PR formatter

on:
  push:
    branches:
      - feature/champion-challenger-reports

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/champion-challenger-reports
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install ruff==0.16.6
      - name: Format PR files and remove temporary workflow
        run: |
          ruff format champion_challenger.py champion_challenger_intervals.py test_champion_challenger.py test_champion_challenger_intervals.py
          git rm .github/workflows/autoformat-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add champion_challenger.py champion_challenger_intervals.py test_champion_challenger.py test_champion_challenger_intervals.py
          git commit -m 'style: apply Ruff formatting to champion challenger reports'
          git push origin HEAD:feature/champion-challenger-reports
