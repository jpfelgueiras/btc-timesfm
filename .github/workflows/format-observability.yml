name: Format observability changes

on:
  push:
    branches:
      - feature/structured-observability

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install 'ruff>=0.16.5,<1'
      - name: Fix and format
        run: |
          ruff check --fix observability.py validated_entrypoints.py test_observability.py
          ruff format observability.py validated_entrypoints.py test_observability.py
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add observability.py validated_entrypoints.py test_observability.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Format observability implementation'
          git push
