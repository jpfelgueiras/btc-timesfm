name: Temporary cross-asset integration patch

on:
  push:
    branches:
      - feature/cross-asset-macro-signals
    paths:
      - maintenance_integrate_cross_asset.py
      - .github/workflows/tmp-integrate-cross-asset.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/cross-asset-macro-signals
      - name: Apply production integration
        run: python maintenance_integrate_cross_asset.py
      - name: Format touched Python
        run: |
          python -m pip install 'ruff>=0.16.5,<1'
          ruff format btc_forecast.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc_forecast.py
          if git diff --cached --quiet; then
            echo "No integration changes"
          else
            git commit -m "Integrate cross-asset signals into production context"
            git push origin HEAD:feature/cross-asset-macro-signals
          fi
