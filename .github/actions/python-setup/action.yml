name: Python workflow setup
description: Configure Python and install dependencies after the workflow checks out the repository.
inputs:
  requirements-file:
    description: Requirements file to install. Leave empty when no dependencies are needed.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: ${{ inputs.requirements-file || 'requirements.txt' }}
    - name: Install dependencies
      if: inputs.requirements-file != ''
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r "${{ inputs.requirements-file }}"
