name: Python workflow setup
description: Check out the repository, configure Python and install dependencies.
inputs:
  requirements-file:
    description: Requirements file to install. Leave empty when no dependencies are needed.
    required: false
    default: ""
  checkout-ref:
    description: Git ref to check out.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.checkout-ref }}
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: ${{ inputs.requirements-file || 'requirements.txt' }}
    - name: Install dependencies
      if: inputs.requirements-file != ''
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r "${{ inputs.requirements-file }}"
